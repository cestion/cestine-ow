name: Unified CI Pipeline

# 合并了 branch-ai-review.yml, feishu-webhook.yml, pr-analysis.yml
# Push 事件触发通知和 AI 分析; PR 事件触发质量门禁

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  # 手动触发: Actions → Unified CI Pipeline → Run workflow
  # 只跑「白盒测试 → AI 评审 → 汇总」这条链,不跑 bundle/tsc 那些重活。
  workflow_dispatch:
    inputs:
      base_ref:
        description: '对比基线 (branch / tag / SHA)。留空则用与默认分支的 merge-base'
        required: false
        type: string
        default: ''
      run_ai_review:
        description: '测试跑完后调用 LLM 做代码评审(会消耗 token)'
        required: false
        type: boolean
        default: true
      notify_feishu:
        description: '把汇总结果推送到飞书'
        required: false
        type: boolean
        default: true

# =============================================================================
# Config Variables (Settings → Variables)
# Push AI 相关:
#   ENABLE_BRANCH_AI   : "false" → 跳过分支 AI 分析        (default: enabled)
#   MINIMAX_MODEL      : MiniMax 模型 ID                  (default: "MiniMax-M3")
#   MINIMAX_BASE_URL   : MiniMax API base                 (default: "https://api.minimaxi.com/anthropic")
#
# Push 评审 / 白盒测试相关:
#   ENABLE_PUSH_CODE_REVIEW : "false" → 关闭 push 代码评审 (default: true)
#   PUSH_REVIEW_MODEL       : push 评审模型                (default: "MiniMax-M3")
#   ENABLE_WHITEBOX_TEST    : "false" → 关闭白盒单测       (default: true)
#   WHITEBOX_FAIL_ON_ERROR  : "true"  → 测试失败即阻断 CI  (default: false,仅报告)
#
# PR Analysis 相关:
#   ENABLE_SONAR       : "true"  → 运行 SonarQube         (default: false)
#   ENABLE_PR_AGENT    : "false" → 关闭 PR-Agent          (default: true)
#   ENABLE_IMPACT      : "false" → 关闭 impact 分析       (default: true)
#   ENABLE_IMPACT_AI   : "false" → 关闭 MiniMax PR 评估   (default: true)
#   ENABLE_BUNDLE_DIFF : "false" → 关闭 bundle 对比       (default: true)
#   ENABLE_TSC_DIFF    : "false" → 关闭 tsc 错误 diff     (default: true)
#   PR_AGENT_MODEL     : PR-Agent 使用的模型              (default: "anthropic/claude-opus-4-8")
#
# Required Secrets:
#   FEISHU_WEBHOOK_URL / LARK_WEBHOOK  — 飞书 webhook
#   MINIMAX_KEY_BLOB                   — 混淆后的 MiniMax key
#   OPENAI_KEY / ANTHROPIC_API_KEY     — PR-Agent LLM key
#   LITELLM_BASE_URL                   — (可选) LiteLLM 自定义路由
#   SONAR_TOKEN / SONAR_HOST_URL       — (仅 ENABLE_SONAR=true 时需要)
# =============================================================================

concurrency:
  # Push 事件: 按 ref 分组 (branch-ai-review + feishu-webhook 共享)
  # PR 事件: 按 PR 号分组 (pr-analysis 的所有 job)
  # 手动触发: 单独分组并按 run_id 唯一 —— 手动跑是有意为之的动作,
  #          既不该被后续 push 取消,也不该去取消正在跑的 push 流水线。
  group: >-
    ${{
      github.event_name == 'pull_request' && format('pr-analysis-{0}', github.event.pull_request.number)
      || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id)
      || format('push-notify-{0}', github.ref)
    }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Push 事件 Job 1: 飞书基础通知
  # ===========================================================================
  feishu-push-notify:
    name: Feishu Push Notify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          COMPARE: ${{ github.event.compare }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi

          SHORT_SHA="${COMMIT_ID:0:7}"
          PAYLOAD=$(jq -n \
            --arg repo    "$REPO" \
            --arg actor   "$ACTOR" \
            --arg branch  "$BRANCH" \
            --arg msg     "$COMMIT_MSG" \
            --arg sha     "$SHORT_SHA" \
            --arg time    "$TIMESTAMP" \
            --arg compare "$COMPARE" \
            --arg commit  "$COMMIT_URL" \
            '{
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true, enable_forward: true },
                header: {
                  template: "green",
                  title: { tag: "plain_text", content: "🚀 新的代码提交" }
                },
                elements: [
                  {
                    tag: "div",
                    fields: [
                      { is_short: true, text: { tag: "lark_md", content: ("**📦 仓库**\n" + $repo) } },
                      { is_short: true, text: { tag: "lark_md", content: ("**🌿 分支**\n`" + $branch + "`") } },
                      { is_short: true, text: { tag: "lark_md", content: ("**👤 提交人**\n" + $actor) } },
                      { is_short: true, text: { tag: "lark_md", content: ("**🔖 版本**\n`" + $sha + "`") } }
                    ]
                  },
                  { tag: "hr" },
                  {
                    tag: "div",
                    text: { tag: "lark_md", content: ("**📝 提交信息**\n" + $msg) }
                  },
                  { tag: "hr" },
                  {
                    tag: "note",
                    elements: [ { tag: "plain_text", content: ("⏰ " + $time) } ]
                  },
                  {
                    tag: "action",
                    actions: [
                      {
                        tag: "button",
                        text: { tag: "plain_text", content: "🔍 查看提交" },
                        type: "primary",
                        url: $commit
                      },
                      {
                        tag: "button",
                        text: { tag: "plain_text", content: "📊 对比变更" },
                        type: "default",
                        url: $compare
                      }
                    ]
                  }
                ]
              }
            }')

          curl -s -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  # ===========================================================================
  # Push 事件 Job 2: 分支 AI 分析
  # ===========================================================================
  branch-ai-review:
    name: Branch AI Review
    if: github.event_name == 'push' && vars.ENABLE_BRANCH_AI != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Resolve BASE / HEAD
        id: refs
        run: |
          HEAD_SHA="${{ github.event.after }}"
          BEFORE="${{ github.event.before }}"

          # 新建分支时 before 全 0,回退到与默认分支的 merge-base
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            git fetch origin "$DEFAULT_BRANCH" --depth=100 || true
            BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || echo "$HEAD_SHA~1")
          else
            BASE_SHA="$BEFORE"
          fi

          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Analyzing $BASE_SHA..$HEAD_SHA"

      - name: Count changed files
        id: count
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          # 全量第一方代码:src/ scripts/ 根配置 .github/ aws/ Dockerfile 等
          COUNT=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -vE '^(node_modules|dist|\.output|coverage)/' \
            | grep -vE '^(src/api/__generated__|src/solana)/|^src/routeTree\.gen\.ts$|^pnpm-lock\.yaml$' \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$|^(\.github/|aws/)|^[^/]*\.(json|yaml|yml|properties)$|^[^/]*Dockerfile$' \
            | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed files: $COUNT"

      - name: Install deps (only if we have work to do)
        if: steps.count.outputs.count != '0'
        run: pnpm install --frozen-lockfile

      - name: Install madge
        if: steps.count.outputs.count != '0'
        run: pnpm add -w -D madge

      - name: Run static impact analysis
        if: steps.count.outputs.count != '0'
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: pnpm exec tsx scripts/pr-impact-analysis.ts > impact-report.md

      - name: Build diff summary
        if: steps.count.outputs.count != '0'
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          git diff --stat "$BASE_SHA" "$HEAD_SHA" > diff-stat.txt
          # 全量第一方代码;仅排除生成代码与锁文件
          git diff --unified=3 "$BASE_SHA" "$HEAD_SHA" \
            -- ':/' \
            ':(exclude)src/api/__generated__/**' \
            ':(exclude)src/solana/**' \
            ':(exclude)src/routeTree.gen.ts' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)node_modules/**' \
            ':(exclude).output/**' \
            ':(exclude)dist/**' \
            | head -c 120000 > diff-truncated.patch

      - name: Call MiniMax-M3
        if: steps.count.outputs.count != '0'
        id: ai
        env:
          MINIMAX_KEY_BLOB: ${{ secrets.MINIMAX_KEY_BLOB }}
          MINIMAX_MODEL:    ${{ vars.MINIMAX_MODEL || 'MiniMax-M3' }}
          MINIMAX_BASE:     ${{ vars.MINIMAX_BASE_URL || 'https://api.minimaxi.com/anthropic' }}
          COMMIT_MSG:       ${{ github.event.head_commit.message }}
          BRANCH:           ${{ github.ref_name }}
        run: |
          if [ -z "$MINIMAX_KEY_BLOB" ]; then
            echo "assessment=_MINIMAX_KEY_BLOB secret 未设置,跳过 AI 评估_" >> "$GITHUB_OUTPUT"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MINIMAX_API_KEY=$(./scripts/lib/keyring.sh decode "$MINIMAX_KEY_BLOB")
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "assessment=_密钥解码失败_" >> "$GITHUB_OUTPUT"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IMPACT=$(cat impact-report.md)
          STAT=$(cat diff-stat.txt)
          DIFF=$(cat diff-truncated.patch)

          cat > /tmp/system-prompt.txt <<'PROMPT_EOF'
          你是一名资深工程师 + 产品经理,正在评审一次分支 push。基于给定的分支信息、静态影响分析报告和 diff,用中文输出精简 Markdown 风险评估,包含 5 段:

          **💼 业务影响** — 从终端用户视角说明:改动波及了哪些业务模块?对应的用户流程可能出现什么变化(如无法进入某页面、操作行为不同、数据展示错误、支付/发放异常)?按业务优先级排序,最多 4 条,每条格式 `- **[模块名]** — 具体影响`。若只改基础设施/工具代码,直接说 "无直接业务影响"。

          **🔥 技术影响范围** — 波及的技术表面(路由、共享模块、hooks、stores、构建配置、CI、基础设施等)。

          **⚠️ 回归风险** — 可能坏的具体场景,按严重度排序,最多 4 条。注意构建配置(vite.config.ts、tsconfig、Dockerfile、依赖锁)与 CI workflow 的改动能影响整个构建/部署,不要因为是"非业务代码"就低估。

          **🧪 测试盲区** — 引用具体文件。

          **✅ 自查清单** — 3-5 条 push 前该验证的项目。

          要求:控制在 800 字以内,飞书卡片渲染友好,引用文件路径和函数名。改动可能涉及 src/ 之外的代码(scripts/、根配置文件、.github/workflows、aws/、Dockerfile 等),请一并评估。

          # 业务模块清单(供业务影响判断参考)
          - **创作(create)** — src/features/create, create-short-video
          - **创作管理(creation-management)** — src/features/creation-management
          - **演员(actor)** / **旁白(narrator)** / **剧集(drama-flow)** — src/features/actor, narrator, drama-flow
          - **观看(play)** — src/features/play
          - **首页/仪表盘** — src/features/home, dashboard
          - **收益(income)** / **邀请(invite)** — src/features/income, invite
          - **UGC** — src/features/ugc
          - **游戏/1011** / **挖矿(mining)** — src/features/game, 1011, mining
          - **通知(notification)** — src/features/notification
          - **个人资料(profile)** / **社交(social)** — src/features/profile, social
          - **搜索(search)** / **勋章(badge)** — src/features/search, badge
          - **法务** — src/features/legal
          - **API 层** — src/api(所有业务接口)
          - **Solana 链上** — src/solana(钱包/代币/链上)
          - **鉴权** — @privy-io/react-auth, src/providers
          # 非业务代码(同样纳入评估)
          - **构建配置** — vite.config.ts, tsconfig*.json, orval.config.ts, package.json, Dockerfile
          - **工具脚本** — scripts/(影响分析、i18n、资源优化、版本注入)
          - **CI/CD** — .github/workflows/
          - **基础设施** — aws/(CloudFormation)
          PROMPT_EOF
          SYSTEM=$(sed 's/^          //' /tmp/system-prompt.txt)

          USER=$(jq -n \
            --arg branch "$BRANCH" \
            --arg msg    "$COMMIT_MSG" \
            --arg impact "$IMPACT" \
            --arg stat   "$STAT" \
            --arg diff   "$DIFF" \
            '"# 分支\n\($branch)\n\n# 最近提交信息\n\($msg)\n\n# 静态影响报告\n\($impact)\n\n# Diff Stat\n```\n\($stat)\n```\n\n# 截断 Diff\n```diff\n\($diff)\n```"')

          PAYLOAD=$(jq -n \
            --arg model "$MINIMAX_MODEL" \
            --arg system "$SYSTEM" \
            --argjson user "$USER" \
            '{
              model: $model,
              system: $system,
              max_tokens: 2000,
              messages: [ { role: "user", content: $user } ]
            }')

          RESPONSE=$(curl -sS --fail-with-body \
            -X POST "$MINIMAX_BASE/v1/messages" \
            -H "x-api-key: $MINIMAX_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || {
              CLEANED=$(echo "$RESPONSE" | sed "s|$MINIMAX_API_KEY|***|g" | head -c 500)
              {
                echo "assessment<<EOF_ASSESSMENT"
                echo "_MiniMax 调用失败:_"
                echo "\`\`\`"
                echo "$CLEANED"
                echo "\`\`\`"
                echo "EOF_ASSESSMENT"
                echo "ok=0"
              } >> "$GITHUB_OUTPUT"
              exit 0
            }

          CONTENT=$(echo "$RESPONSE" | jq -r '(.content // []) | map(select(.type=="text") | .text) | join("\n")')
          if [ -z "$CONTENT" ]; then CONTENT="_无法解析 MiniMax 响应_"; fi

          {
            echo "assessment<<EOF_ASSESSMENT"
            echo "$CONTENT"
            echo "EOF_ASSESSMENT"
            echo "ok=1"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Feishu
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO:       ${{ github.repository }}
          BRANCH:     ${{ github.ref_name }}
          ACTOR:      ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_ID:  ${{ github.event.head_commit.id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMPARE:    ${{ github.event.compare }}
          CHANGED:    ${{ steps.count.outputs.count }}
          ASSESSMENT: ${{ steps.ai.outputs.assessment }}
          MODEL:      ${{ vars.MINIMAX_MODEL || 'MiniMax-M3' }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi

          SHORT_SHA="${COMMIT_ID:0:7}"

          if [ "${CHANGED:-0}" = "0" ]; then
            BODY="_本次推送未修改代码或配置文件,已跳过 AI 分析。_"
            TEMPLATE="grey"
            TITLE="🤖 分支变更 AI 分析(跳过)"
          elif [ -z "$ASSESSMENT" ]; then
            BODY="_AI 分析未生成结果,请查看 Actions 日志。_"
            TEMPLATE="orange"
            TITLE="🤖 分支变更 AI 分析(失败)"
          else
            BODY="$ASSESSMENT"
            TEMPLATE="blue"
            TITLE="🤖 分支变更 AI 分析"
          fi

          PAYLOAD=$(jq -n \
            --arg repo    "$REPO" \
            --arg branch  "$BRANCH" \
            --arg actor   "$ACTOR" \
            --arg sha     "$SHORT_SHA" \
            --arg msg     "$COMMIT_MSG" \
            --arg changed "$CHANGED" \
            --arg body    "$BODY" \
            --arg model   "$MODEL" \
            --arg commit  "$COMMIT_URL" \
            --arg compare "$COMPARE" \
            --arg tmpl    "$TEMPLATE" \
            --arg title   "$TITLE" \
            '{
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true, enable_forward: true },
                header: {
                  template: $tmpl,
                  title: { tag: "plain_text", content: $title }
                },
                elements: [
                  {
                    tag: "div",
                    fields: [
                      { is_short: true, text: { tag: "lark_md", content: ("**🌿 分支**\n`" + $branch + "`") } },
                      { is_short: true, text: { tag: "lark_md", content: ("**🔖 版本**\n`" + $sha + "`") } },
                      { is_short: true, text: { tag: "lark_md", content: ("**👤 提交人**\n" + $actor) } },
                      { is_short: true, text: { tag: "lark_md", content: ("**📊 源码改动**\n" + $changed + " 文件") } }
                    ]
                  },
                  { tag: "hr" },
                  { tag: "div", text: { tag: "lark_md", content: $body } },
                  { tag: "hr" },
                  { tag: "note", elements: [ { tag: "plain_text", content: ("🧠 " + $model + " · " + $repo) } ] },
                  {
                    tag: "action",
                    actions: [
                      { tag: "button", text: { tag: "plain_text", content: "🔍 查看提交" }, type: "primary",  url: $commit  },
                      { tag: "button", text: { tag: "plain_text", content: "📊 对比变更" }, type: "default", url: $compare }
                    ]
                  }
                ]
              }
            }')

          curl -s -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  # ===========================================================================
  # Push 事件 Job 3: 代码级 AI 评审(仿 PR-Agent,但输出到飞书/job summary)
  #
  # 依赖 whitebox-test:评审必须拿到真实测试结果才动笔。模型看 diff 只能猜
  # 「这里可能有 bug」,拿到「这个函数 0 覆盖率且它的用例挂了」才是硬证据。
  # refs 由 whitebox-test 统一解析后透传,这里不再重复一遍。
  # ===========================================================================
  push-code-review:
    name: Push Code Review (AI)
    needs: whitebox-test
    # whitebox-test 被开关关掉时是 skipped,评审不该跟着一起被跳过
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'push'
              || (github.event_name == 'workflow_dispatch' && inputs.run_ai_review))
          && vars.ENABLE_PUSH_CODE_REVIEW != 'false' }}
    runs-on: ubuntu-latest
    # 评审结论交给下游 report-feishu 统一发卡,本 job 自己不再单独推飞书
    outputs:
      review: ${{ steps.review.outputs.review }}
      changed: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve BASE / HEAD
        id: refs
        env:
          # whitebox-test 已经算过一次;它被跳过时(job 关闭)才走本地兜底
          UPSTREAM_BASE: ${{ needs.whitebox-test.outputs.base }}
          UPSTREAM_HEAD: ${{ needs.whitebox-test.outputs.head }}
        run: |
          BASE_SHA="$UPSTREAM_BASE"
          HEAD_SHA="$UPSTREAM_HEAD"

          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="${{ github.event.after || github.sha }}"
          fi
          if [ -z "$BASE_SHA" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
              BASE_SHA="$BEFORE"
            else
              DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
              BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || echo "$HEAD_SHA~1")
            fi
          fi

          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Reviewing $BASE_SHA..$HEAD_SHA"

      # whitebox-test 跑在另一个 runner 上,它的 /tmp 不共享,靠 artifact 传递
      - name: Download white-box test context
        if: ${{ needs.whitebox-test.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: whitebox-ai-context-${{ github.run_id }}
          path: /tmp/whitebox

      - name: Count changed source files
        id: count
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          COUNT=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -vE '^(node_modules|dist|\.output|coverage)/' \
            | grep -vE '^(src/api/__generated__|src/solana)/|^src/routeTree\.gen\.ts$|^pnpm-lock\.yaml$' \
            | grep -E '\.(ts|tsx|js|jsx)$' \
            | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed source files: $COUNT"

      - name: Build diff for review
        if: steps.count.outputs.count != '0'
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          git diff --unified=5 "$BASE_SHA" "$HEAD_SHA" \
            -- ':/' \
            ':(exclude)src/api/__generated__/**' \
            ':(exclude)src/solana/**' \
            ':(exclude)src/routeTree.gen.ts' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)node_modules/**' \
            ':(exclude).output/**' \
            ':(exclude)dist/**' \
            | head -c 150000 > /tmp/review-diff.patch

      - name: Call LLM for code review
        if: steps.count.outputs.count != '0'
        id: review
        env:
          MINIMAX_KEY_BLOB: ${{ secrets.MINIMAX_KEY_BLOB }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: ${{ vars.PUSH_REVIEW_MODEL || 'MiniMax-M3' }}
          MINIMAX_BASE: ${{ vars.MINIMAX_BASE_URL || 'https://api.minimaxi.com/anthropic' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          TEST_STATUS: ${{ needs.whitebox-test.result }}
        run: |
          DIFF=$(cat /tmp/review-diff.patch)

          # workflow_dispatch 没有 head_commit,回落到 git log
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%s "${{ steps.refs.outputs.head }}" 2>/dev/null || echo "(手动触发)")
          fi

          # 白盒测试上下文。拿不到就明说「没跑」,不要让模型误以为测试全绿。
          if [ -s /tmp/whitebox/ai-context.md ]; then
            TESTS=$(cat /tmp/whitebox/ai-context.md)
          elif [ "$TEST_STATUS" = "skipped" ]; then
            TESTS="本次未运行白盒单测(ENABLE_WHITEBOX_TEST 已关闭)。评审时不要假设代码有测试保护。"
          else
            TESTS="白盒单测运行了但结果未能取回(job 结论:${TEST_STATUS:-unknown})。评审时不要假设代码有测试保护。"
          fi

          cat > /tmp/system-prompt.txt <<'PROMPT_EOF'
          你是代码评审专家,对一次 push 做代码质量评审。

          你会同时拿到 diff 和这次改动的**白盒单测实测结果**。测试结果是事实证据,
          比你从 diff 里推断出的猜测更可信,评审时必须用上:

          - 有失败用例 → 把它当最高优先级线索,顺着失败信息在 diff 里定位成因,
            而不是泛泛复述"测试挂了"。
          - 本次改动的文件被标为「零覆盖」→ 对这些文件的评审要更严格,
            因为它们的行为改动没有任何自动化验证兜底;在建议里点名该补什么用例。
          - 测试全绿也不等于没问题:覆盖率只覆盖逻辑层,UI 与副作用不在范围内。

          输出精简的中文 Markdown,包含:

          **🔍 关键发现** — 按严重度排序,最多 5 条:
          - 逻辑错误、潜在崩溃、资源泄漏
          - 安全风险(XSS、注入、敏感数据泄露、鉴权绕过)
          - 性能问题(不必要的重渲染、同步阻塞、内存占用)
          - 类型不安全、边界条件未处理

          **🧪 测试视角** — 结合上面的实测结果,最多 3 条:失败用例的根因推断,
          或本次改动中最该补测试的位置(点名文件与函数)。没什么可说就写一行"无"。

          **✅ 做得好的地方** — 最多 3 条值得称赞的实践。

          **💡 建议** — 可选优化,非阻断性,最多 3 条。

          要求:引用具体文件与行号,用反引号包文件名;若代码质量良好无重大问题,直言 "未发现严重问题";控制在 700 字内。
          PROMPT_EOF
          SYSTEM=$(sed 's/^          //' /tmp/system-prompt.txt)

          USER=$(jq -n \
            --arg branch "$BRANCH" \
            --arg msg "$COMMIT_MSG" \
            --arg tests "$TESTS" \
            --arg diff "$DIFF" \
            '"# 分支\n\($branch)\n\n# 提交信息\n\($msg)\n\n# 白盒测试结果(实测,非推断)\n\($tests)\n\n# Diff\n```diff\n\($diff)\n```"')

          # 根据配置选择 API
          if [[ "$REVIEW_MODEL" == MiniMax* ]] && [ -n "$MINIMAX_KEY_BLOB" ]; then
            API_KEY=$(./scripts/lib/keyring.sh decode "$MINIMAX_KEY_BLOB" 2>/dev/null || echo "")
            if [ -z "$API_KEY" ]; then
              echo "review=_MiniMax 密钥解码失败_" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            API_BASE="$MINIMAX_BASE/v1/messages"
            MODEL_ID="$REVIEW_MODEL"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            API_KEY="$ANTHROPIC_API_KEY"
            API_BASE="https://api.anthropic.com/v1/messages"
            MODEL_ID="claude-opus-4-8"
          else
            echo "review=_未配置 LLM key_" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg model "$MODEL_ID" \
            --arg system "$SYSTEM" \
            --argjson user "$USER" \
            '{
              model: $model,
              system: $system,
              max_tokens: 2000,
              messages: [ { role: "user", content: $user } ]
            }')

          RESPONSE=$(curl -sS --fail-with-body \
            -X POST "$API_BASE" \
            -H "x-api-key: $API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || {
              CLEANED=$(echo "$RESPONSE" | sed "s|$API_KEY|***|g" | head -c 500)
              echo "review=_LLM 调用失败: $CLEANED_" >> "$GITHUB_OUTPUT"
              exit 0
            }

          CONTENT=$(echo "$RESPONSE" | jq -r '(.content // []) | map(select(.type=="text") | .text) | join("\n")')
          if [ -z "$CONTENT" ]; then CONTENT="_无法解析 LLM 响应_"; fi

          {
            echo "review<<EOF_REVIEW"
            echo "$CONTENT"
            echo "EOF_REVIEW"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to job summary
        if: always()
        env:
          CHANGED: ${{ steps.count.outputs.count }}
          REVIEW: ${{ steps.review.outputs.review }}
        run: |
          {
            echo "## 🔍 代码评审 (AI)"
            echo ""
            if [ "${CHANGED:-0}" = "0" ]; then
              echo "_本次推送未修改源码,已跳过代码评审。_"
            elif [ -z "$REVIEW" ]; then
              echo "_代码评审未生成结果,请查看 Actions 日志。_"
            else
              echo "$REVIEW"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Push 事件 Job 2.5: 白盒单测(Vitest)—— 整条评审链的上游
  #
  # 与上游三个 AI job 的本质区别:这一步**真的执行代码**,不是让模型读 diff 说话。
  # 因此它必须跑在 push-code-review 之前 —— 评审模型拿到「这个函数的用例挂了 /
  # 这次改的文件零覆盖」才算有据可依,只看 diff 就只能靠猜。
  #
  # 覆盖范围见 vitest.config.ts 的 coverage.include(逻辑层:utils/lib/stores/hooks/api)。
  # 结果的解析、渲染、喂给 LLM 的裁剪,全部收敛在 scripts/whitebox-report.ts,
  # 本地 skill 与 CI 共用同一份逻辑,不在 YAML 里再写一遍 jq。
  # ===========================================================================
  whitebox-test:
    name: White-box Tests (Vitest)
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && vars.ENABLE_WHITEBOX_TEST != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      total: ${{ steps.parse.outputs.total }}
      passed: ${{ steps.parse.outputs.passed }}
      failed: ${{ steps.parse.outputs.failed }}
      skipped: ${{ steps.parse.outputs.skipped }}
      files: ${{ steps.parse.outputs.files }}
      coverage: ${{ steps.parse.outputs.coverage }}
      passRate: ${{ steps.parse.outputs.passRate }}
      failures: ${{ steps.parse.outputs.failures }}
      # 下游 push-code-review 直接复用,避免两个 job 各算一遍 merge-base
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要历史来算 merge-base 和 changed-file 覆盖率
          fetch-depth: 0

      - name: Resolve BASE / HEAD
        id: refs
        env:
          # workflow_dispatch 没有 event.before/after,只有 github.sha
          MANUAL_BASE: ${{ inputs.base_ref }}
        run: |
          HEAD_SHA="${{ github.event.after || github.sha }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          # checkout 用了 fetch-depth: 0,所有 branch/tag 的完整历史都已在本地。
          # 这里**不要**再 `git fetch --depth=N` —— 那会把完整仓库改成浅仓库,
          # 反而让后面的 merge-base 算不出来。

          if [ -n "$MANUAL_BASE" ]; then
            # 手动触发且显式指定了基线
            BASE_SHA=$(git rev-parse --verify "$MANUAL_BASE^{commit}" 2>/dev/null \
              || git rev-parse --verify "origin/$MANUAL_BASE^{commit}" 2>/dev/null \
              || echo "")
            if [ -z "$BASE_SHA" ]; then
              echo "::warning::基线 '$MANUAL_BASE' 解析不出来,回退到与默认分支的 merge-base"
            fi
          fi

          if [ -z "${BASE_SHA:-}" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
              BASE_SHA="$BEFORE"
            else
              BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || echo "$HEAD_SHA~1")
            fi
          fi

          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Diff range: $BASE_SHA..$HEAD_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run white-box tests
        id: vitest
        run: |
          # 不用 `pnpm test:coverage`:pnpm 会吃掉 --reporter 这类参数,直接调 vitest 更可控。
          # --passWithNoTests:测试是分批生成进仓库的,空仓阶段不该把 CI 搞红。
          set +e
          pnpm exec vitest run \
            --coverage \
            --passWithNoTests \
            --reporter=default \
            --reporter=json \
            --outputFile=/tmp/vitest-results.json
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "vitest exited with $EXIT_CODE"
          exit 0

      - name: Aggregate report
        id: parse
        env:
          VITEST_EXIT_CODE: ${{ steps.vitest.outputs.exit_code }}
          VITEST_RESULTS: /tmp/vitest-results.json
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          mkdir -p /tmp/whitebox

          # 三种形态一次性产出:json 喂 job outputs,markdown 进 summary,
          # ai 是给下游评审模型的裁剪版(只留失败原因 + 本次改动的零覆盖文件)。
          pnpm exec tsx scripts/whitebox-report.ts --format=json     > /tmp/whitebox/summary.json
          pnpm exec tsx scripts/whitebox-report.ts --format=markdown > /tmp/whitebox/report.md
          pnpm exec tsx scripts/whitebox-report.ts --format=ai       > /tmp/whitebox/ai-context.md

          S=/tmp/whitebox/summary.json
          {
            echo "status=$(jq -r '.status' "$S")"
            echo "total=$(jq -r '.total' "$S")"
            echo "passed=$(jq -r '.passed' "$S")"
            echo "failed=$(jq -r '.failed' "$S")"
            echo "skipped=$(jq -r '.skipped' "$S")"
            echo "files=$(jq -r '.files' "$S")"
            echo "coverage=$(jq -r '.coverageLines // "-"' "$S")"
            echo "passRate=$(jq -r '.passRate // "-"' "$S")"
          } >> "$GITHUB_OUTPUT"

          # 失败清单单独走 heredoc(多行),飞书卡片侧再截断
          {
            echo "failures<<EOF_FAILURES"
            jq -r '
              if (.failures | length) == 0 then "_无失败用例_"
              else (.failures | map("- `\(.file | split("/") | last)` › \(.name)") | join("\n"))
              end
            ' "$S"
            echo "EOF_FAILURES"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to job summary
        if: always()
        run: |
          if [ -f /tmp/whitebox/report.md ]; then
            cat /tmp/whitebox/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 🧪 白盒单测 (Vitest)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_汇总脚本未执行成功,请查看 Actions 日志。_" >> "$GITHUB_STEP_SUMMARY"
          fi

      # push-code-review 在另一个 runner 上,拿不到这里的 /tmp。
      # 走 artifact 传 ai-context.md,而不是塞进 job output ——
      # job output 有 1MB 上限且会被 GitHub 做表达式插值,多行 Markdown 容易被玩坏。
      - name: Upload AI review context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitebox-ai-context-${{ github.run_id }}
          path: /tmp/whitebox/ai-context.md
          if-no-files-found: warn
          retention-days: 1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitebox-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce failure policy
        # 默认不阻断,与现有全部 job 的行为一致;要把 CI 变成真门禁就把这个变量打开
        if: ${{ vars.WHITEBOX_FAIL_ON_ERROR == 'true' && steps.parse.outputs.status != 'passed' && steps.parse.outputs.status != 'empty' }}
        run: |
          echo "::error::白盒单测未通过 (status=${{ steps.parse.outputs.status }}),WHITEBOX_FAIL_ON_ERROR=true 故阻断"
          exit 1

  # ===========================================================================
  # Push 事件 Job 4: 汇总 AI 评审 + 白盒测试结果 → 一张飞书卡片
  #
  # push-code-review 与 whitebox-test 都不再自己发卡,统一由这里发,
  # 避免一次 push 收到三四张卡。手动触发时由 notify_feishu 输入决定发不发。
  # ===========================================================================
  report-feishu:
    name: Report to Feishu
    needs: [push-code-review, whitebox-test]
    if: >-
      ${{ always()
          && (github.event_name == 'push'
              || (github.event_name == 'workflow_dispatch' && inputs.notify_feishu)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Send merged report card
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          # workflow_dispatch 没有 head_commit,退回 github.sha 与 commit 页面 URL
          COMMIT_ID: ${{ github.event.head_commit.id || github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_RESULT: ${{ needs.push-code-review.result }}
          REVIEW: ${{ needs.push-code-review.outputs.review }}
          REVIEW_CHANGED: ${{ needs.push-code-review.outputs.changed }}
          TEST_RESULT: ${{ needs.whitebox-test.result }}
          TEST_STATUS: ${{ needs.whitebox-test.outputs.status }}
          TEST_TOTAL: ${{ needs.whitebox-test.outputs.total }}
          TEST_PASSED: ${{ needs.whitebox-test.outputs.passed }}
          TEST_FAILED: ${{ needs.whitebox-test.outputs.failed }}
          TEST_SKIPPED: ${{ needs.whitebox-test.outputs.skipped }}
          TEST_FILES: ${{ needs.whitebox-test.outputs.files }}
          TEST_COVERAGE: ${{ needs.whitebox-test.outputs.coverage }}
          TEST_RATE: ${{ needs.whitebox-test.outputs.passRate }}
          TEST_FAILURES: ${{ needs.whitebox-test.outputs.failures }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi

          SHORT_SHA="${COMMIT_ID:0:7}"
          SUFFIX=""
          [ "$EVENT" = "workflow_dispatch" ] && SUFFIX=" · 手动触发"

          # ---- 卡片主色与标题由测试结果决定,测试是唯一会"判对错"的环节 ----
          case "$TEST_STATUS" in
            passed)
              TEMPLATE="green"; TITLE="✅ 代码评审 + 白盒测试${SUFFIX}"
              TEST_HEAD="✅ **全部通过**" ;;
            failed)
              TEMPLATE="red";   TITLE="❌ 代码评审 + 白盒测试${SUFFIX}"
              TEST_HEAD="❌ **有用例失败**" ;;
            empty)
              TEMPLATE="grey";  TITLE="⚪️ 代码评审 + 白盒测试(无用例)${SUFFIX}"
              TEST_HEAD="⚪️ **暂无测试用例** — 本地跑 \`pnpm whitebox\` 起步" ;;
            error)
              TEMPLATE="orange"; TITLE="🟠 代码评审 + 白盒测试(执行异常)${SUFFIX}"
              TEST_HEAD="🟠 **Vitest 执行异常**" ;;
            *)
              TEMPLATE="grey";  TITLE="⚪️ 代码评审 + 白盒测试(未执行)${SUFFIX}"
              TEST_HEAD="⚪️ **测试未执行**(job 结果:${TEST_RESULT:-skipped})" ;;
          esac

          # ---- 通过率(whitebox-report.ts 已经算好,这里只做展示兜底)----
          if [ -n "$TEST_RATE" ] && [ "$TEST_RATE" != "-" ] && [ "$TEST_RATE" != "null" ]; then
            RATE_TEXT="${TEST_RATE}% (${TEST_PASSED}/${TEST_TOTAL})"
          else
            RATE_TEXT="—"
          fi

          # ---- AI 评审正文 ----
          if [ "$REVIEW_RESULT" != "success" ]; then
            REVIEW_BODY="_AI 评审未执行(job 结果:${REVIEW_RESULT:-skipped})。_"
          elif [ "${REVIEW_CHANGED:-0}" = "0" ]; then
            REVIEW_BODY="_本次推送未修改源码,已跳过代码评审。_"
          elif [ -z "$REVIEW" ]; then
            REVIEW_BODY="_评审未生成结果,请查看 Actions 日志。_"
          else
            # 飞书单个 div 有长度上限,超长截断。
            # 注意:这里一律用 printf 拼多行,不写字面换行的赋值 —— YAML 的 `run: |`
            # 是块标量,一旦续行顶到第 1 列就会提前终止块,整个 workflow 文件解析失败。
            REVIEW_BODY=$(printf '%s' "$REVIEW" | head -c 2500)
            if [ "$(printf '%s' "$REVIEW" | wc -c)" -gt 2500 ]; then
              REVIEW_BODY=$(printf '%s\n\n%s' "$REVIEW_BODY" '_…评审内容过长已截断,完整版见 Actions job summary。_')
            fi
          fi

          # ---- 测试正文 ----
          TEST_BODY="$TEST_HEAD"
          if [ "${TEST_TOTAL:-0}" -gt 0 ] 2>/dev/null; then
            STATS="测试文件 **${TEST_FILES}** · 用例 **${TEST_TOTAL}** · 通过 **${TEST_PASSED}** · 失败 **${TEST_FAILED}** · 跳过 **${TEST_SKIPPED}** · 行覆盖率 **${TEST_COVERAGE}%**"
            TEST_BODY=$(printf '%s\n\n%s' "$TEST_BODY" "$STATS")
          fi
          if [ "$TEST_STATUS" = "failed" ] || [ "$TEST_STATUS" = "error" ]; then
            TEST_BODY=$(printf '%s\n\n**失败用例**\n%s' "$TEST_BODY" "$TEST_FAILURES")
          fi

          PAYLOAD=$(jq -n \
            --arg repo   "$REPO" \
            --arg branch "$BRANCH" \
            --arg actor  "$ACTOR" \
            --arg sha    "$SHORT_SHA" \
            --arg rate   "$RATE_TEXT" \
            --arg review "$REVIEW_BODY" \
            --arg test   "$TEST_BODY" \
            --arg commit "$COMMIT_URL" \
            --arg run    "$RUN_URL" \
            --arg tmpl   "$TEMPLATE" \
            --arg title  "$TITLE" \
            '{
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true, enable_forward: true },
                header: {
                  template: $tmpl,
                  title: { tag: "plain_text", content: $title }
                },
                elements: [
                  {
                    tag: "div",
                    fields: [
                      { is_short: true, text: { tag: "lark_md", content: ("**🌿 分支**\n`" + $branch + "`") } },
                      { is_short: true, text: { tag: "lark_md", content: ("**🔖 版本**\n`" + $sha + "`") } },
                      { is_short: true, text: { tag: "lark_md", content: ("**👤 提交人**\n" + $actor) } },
                      { is_short: true, text: { tag: "lark_md", content: ("**📈 通过率**\n" + $rate) } }
                    ]
                  },
                  { tag: "hr" },
                  { tag: "div", text: { tag: "lark_md", content: ("**🔍 代码评审 (AI)**\n" + $review) } },
                  { tag: "hr" },
                  { tag: "div", text: { tag: "lark_md", content: ("**🧪 白盒单测 (Vitest)**\n" + $test) } },
                  { tag: "hr" },
                  { tag: "note", elements: [ { tag: "plain_text", content: ("📦 " + $repo) } ] },
                  {
                    tag: "action",
                    actions: [
                      { tag: "button", text: { tag: "plain_text", content: "🔍 查看提交" },  type: "primary", url: $commit },
                      { tag: "button", text: { tag: "plain_text", content: "⚙️ 查看 Actions" }, type: "default", url: $run }
                    ]
                  }
                ]
              }
            }')

          curl -s -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  # ===========================================================================
  # PR 事件 Job 1: Lark 通知
  # ===========================================================================
  pr-notify-lark:
    name: Notify Lark on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Send Lark message
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          if [ -z "$LARK_WEBHOOK" ]; then
            echo "LARK_WEBHOOK not set; skipping"
            exit 0
          fi

          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_USER="${{ github.event.pull_request.user.login }}"
          ACTION="${{ github.event.action }}"
          REPO="${{ github.repository }}"

          MSG="仓库: ${REPO}\nPR ${ACTION}: ${PR_TITLE}\n作者: ${PR_USER}\n链接: ${PR_URL}"

          curl -s -X POST "$LARK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"${MSG}\"}}"

  # ===========================================================================
  # PR 事件 Job 2: SonarQube (默认关闭)
  # ===========================================================================
  pr-sonar:
    name: SonarQube
    if: github.event_name == 'pull_request' && vars.ENABLE_SONAR == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'web-onestory' }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

  # ===========================================================================
  # PR 事件 Job 3: PR-Agent AI Review
  # ===========================================================================
  pr-agent:
    name: PR-Agent (AI Review)
    if: github.event_name == 'pull_request' && vars.ENABLE_PR_AGENT != 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - name: PR-Agent action
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY:        ${{ secrets.OPENAI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_BASE:   ${{ secrets.LITELLM_BASE_URL }}

          CONFIG__MODEL: ${{ vars.PR_AGENT_MODEL || 'anthropic/claude-opus-4-8' }}
          CONFIG__FALLBACK_MODELS: '["anthropic/claude-haiku-4-5-20251001"]'
          CONFIG__PUBLISH_OUTPUT: 'true'
          CONFIG__VERBOSITY_LEVEL: '1'

          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'true'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'false'

          PR_REVIEWER__EXTRA_INSTRUCTIONS: |
            重点关注:
            1. 影响范围 — 改动的模块被谁引用,是否有跨页面/跨路由的副作用
            2. 回归风险 — 是否可能破坏其他功能,尤其是共享 hooks / stores / providers
            3. 安全 — 敏感数据处理、鉴权、XSS、SQL/命令注入
            4. 性能 — 不必要的重渲染、bundle 体积、hot path 上的同步操作
            忽略纯样式和格式化建议(Biome 已经在处理)。

  # ===========================================================================
  # PR 事件 Job 4: Impact Analysis
  # (push 侧的同一套分析由上面的 branch-ai-review 承担,避免重复)
  # ===========================================================================
  pr-impact:
    name: Impact Analysis
    if: github.event_name == 'pull_request' && vars.ENABLE_IMPACT != 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Install madge
        run: pnpm add -w -D madge

      - name: Run impact analysis
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec tsx scripts/pr-impact-analysis.ts > impact-report.md

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-impact
          path: impact-report.md

      - name: Upload impact report artifact
        uses: actions/upload-artifact@v4
        with:
          name: impact-report
          path: impact-report.md
          retention-days: 7

  # ===========================================================================
  # PR 事件 Job 5: Impact Risk (MiniMax)
  # ===========================================================================
  pr-impact-ai:
    name: Impact Risk (MiniMax)
    if: github.event_name == 'pull_request' && vars.ENABLE_IMPACT_AI != 'false'
    needs: pr-impact
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download impact report
        uses: actions/download-artifact@v4
        with:
          name: impact-report

      - name: Build diff summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --numstat "$BASE_SHA" "$HEAD_SHA" > diff-numstat.txt
          git diff --unified=3 --stat "$BASE_SHA" "$HEAD_SHA" > diff-stat.txt
          git diff --unified=3 "$BASE_SHA" "$HEAD_SHA" \
            -- 'src/**' ':(exclude)src/api/__generated__/**' ':(exclude)src/solana/**' ':(exclude)src/routeTree.gen.ts' \
            | head -c 120000 > diff-truncated.patch

      - name: Call MiniMax-M3
        env:
          MINIMAX_KEY_BLOB: ${{ secrets.MINIMAX_KEY_BLOB }}
          MINIMAX_MODEL:    ${{ vars.MINIMAX_MODEL || 'MiniMax-M3' }}
          MINIMAX_BASE:     ${{ vars.MINIMAX_BASE_URL || 'https://api.minimaxi.com/anthropic' }}
          PR_TITLE:         ${{ github.event.pull_request.title }}
          PR_BODY:          ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$MINIMAX_KEY_BLOB" ]; then
            echo "## 🤖 Impact Risk (MiniMax-M3)" > ai-report.md
            echo "" >> ai-report.md
            echo "_MINIMAX_KEY_BLOB secret not set — skipping AI assessment._" >> ai-report.md
            exit 0
          fi

          MINIMAX_API_KEY=$(./scripts/lib/keyring.sh decode "$MINIMAX_KEY_BLOB")
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "## 🤖 Impact Risk (MiniMax-M3)" > ai-report.md
            echo "" >> ai-report.md
            echo "_Failed to decode MINIMAX_KEY_BLOB — check the encoded value._" >> ai-report.md
            exit 0
          fi

          IMPACT=$(cat impact-report.md)
          STAT=$(cat diff-stat.txt)
          DIFF=$(cat diff-truncated.patch)

          cat > /tmp/system-prompt.txt <<'PROMPT_EOF'
          你是一名资深工程师 + 产品经理,正在评审一个 pull request。你会收到:(1) 静态影响分析报告,(2) diff stat,(3) 截断的 unified diff,(4) 项目业务模块清单。用中文输出精简的 Markdown 风险评估,包含以下 5 段:

          **💼 业务影响** — 从终端用户视角说明:改动波及了哪些业务模块(参考业务清单,如创作、演员、剧本、观看、收益、邀请、UGC、社交、内购、挖矿等)?对应的用户流程可能出现什么变化(如无法进入某个页面、某个操作行为不同、数据展示错误、支付/发放异常)?按业务优先级排序,最多 5 条,每条格式为 `- **[模块名]** — 具体影响`。如果只改基础设施/工具代码没有直接业务影响,明确说 "无直接业务影响"。

          **🔥 技术影响范围** — 波及的技术表面(路由、共享模块、hooks、stores、providers、构建配置、CI、基础设施等)。

          **⚠️ 回归风险** — 具体可能坏的场景,按严重度排序,最多 5 条。注意构建配置(vite.config.ts、tsconfig、Dockerfile、依赖)与 CI/基础设施改动能影响整个构建与部署。

          **🧪 测试盲区** — 未覆盖的路径,引用具体文件。

          **✅ Reviewer checklist** — 合并前必须验证的 3-6 项。

          要求:引用具体文件路径和函数名;若 diff 看起来安全,直言无风险;不要重复静态报告的内容,要在其上增加信号。改动可能涉及 src/ 之外的代码(scripts/、根配置文件、.github/workflows、aws/、Dockerfile 等),请一并评估。

          # 业务模块清单(供业务影响判断参考)
          - **创作(create)** — src/features/create, src/routes/create.tsx, create-short-video
          - **创作管理(creation-management)** — src/features/creation-management
          - **演员(actor)** — src/features/actor, src/routes/actor
          - **旁白/剧本(narrator)** — src/features/narrator
          - **剧集(drama-flow)** — src/features/drama-flow, src/routes/dramas.tsx
          - **观看(play)** — src/features/play, src/routes/play
          - **首页(home / dashboard)** — src/features/home, src/features/dashboard
          - **收益(income)** — src/features/income, src/routes/income
          - **邀请(invite)** — src/features/invite, src/routes/invite
          - **UGC** — src/features/ugc
          - **游戏/1011** — src/features/game, src/features/1011
          - **挖矿(mining)** — src/features/mining
          - **通知(notification)** — src/features/notification
          - **个人资料(profile)** — src/features/profile, src/routes/profile
          - **社交(social)** — src/features/social, src/routes/social-bind.tsx
          - **搜索(search)** — src/features/search, src/routes/search.tsx
          - **勋章/成就(badge)** — src/features/badge
          - **法务(legal / privacy / terms / whitepaper)** — src/features/legal, 相关路由
          - **API 层** — src/api(所有业务接口)
          - **Solana 链上交互** — src/solana(钱包、代币、链上操作)
          - **鉴权/Privy** — @privy-io/react-auth 相关,src/providers
          # 非业务代码(同样纳入评估)
          - **构建配置** — vite.config.ts, tsconfig*.json, orval.config.ts, package.json, Dockerfile
          - **工具脚本** — scripts/(影响分析、i18n、资源优化、版本注入)
          - **CI/CD** — .github/workflows/
          - **基础设施** — aws/(CloudFormation)
          PROMPT_EOF
          SYSTEM=$(sed 's/^          //' /tmp/system-prompt.txt)

          USER=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg body  "$PR_BODY" \
            --arg impact "$IMPACT" \
            --arg stat   "$STAT" \
            --arg diff   "$DIFF" \
            '"# PR Title\n\($title)\n\n# PR Description\n\($body)\n\n# Impact Report (from static analysis)\n\($impact)\n\n# Diff Stat\n```\n\($stat)\n```\n\n# Truncated Diff\n```diff\n\($diff)\n```"')

          PAYLOAD=$(jq -n \
            --arg model "$MINIMAX_MODEL" \
            --arg system "$SYSTEM" \
            --argjson user "$USER" \
            '{
              model: $model,
              system: $system,
              max_tokens: 2500,
              messages: [ { role: "user", content: $user } ]
            }')

          RESPONSE=$(curl -sS --fail-with-body \
            -X POST "$MINIMAX_BASE/v1/messages" \
            -H "x-api-key: $MINIMAX_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || {
              CLEANED=$(echo "$RESPONSE" | sed "s|$MINIMAX_API_KEY|***|g" | head -c 500)
              {
                echo "## 🤖 Impact Risk (MiniMax-M3)"
                echo ""
                echo "_MiniMax call failed:_"
                echo '```'
                echo "$CLEANED"
                echo '```'
              } > ai-report.md
              exit 0
            }

          CONTENT=$(echo "$RESPONSE" | jq -r '(.content // []) | map(select(.type=="text") | .text) | join("\n")')
          if [ -z "$CONTENT" ]; then CONTENT="_Failed to parse MiniMax response._"; fi

          {
            echo "## 🤖 Impact Risk (MiniMax-M3)"
            echo ""
            echo "$CONTENT"
          } > ai-report.md

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-impact-ai
          path: ai-report.md

  # ===========================================================================
  # Job 6: Bundle Size Diff(push 与 PR 都跑)
  # ===========================================================================
  pr-bundle-diff:
    name: Bundle Size Diff
    if: vars.ENABLE_BUNDLE_DIFF != 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Resolve BASE / HEAD
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            HEAD_SHA="${{ github.event.after }}"
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
              git fetch origin "$DEFAULT_BRANCH" --depth=100 || true
              BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || echo "$HEAD_SHA~1")
            else
              BASE_SHA="$BEFORE"
            fi
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Build BASE
        run: |
          git checkout ${{ steps.refs.outputs.base }}
          pnpm install --frozen-lockfile
          pnpm run build:production
          du -sk .output > /tmp/base-size.txt
          find .output -type f -name '*.mjs' -o -name '*.js' | xargs du -k | sort -rn | head -20 > /tmp/base-chunks.txt

      - name: Build HEAD
        run: |
          git checkout ${{ steps.refs.outputs.head }}
          pnpm install --frozen-lockfile
          pnpm run build:production
          du -sk .output > /tmp/head-size.txt
          find .output -type f -name '*.mjs' -o -name '*.js' | xargs du -k | sort -rn | head -20 > /tmp/head-chunks.txt

      - name: Compare
        run: |
          BASE_KB=$(awk '{print $1}' /tmp/base-size.txt)
          HEAD_KB=$(awk '{print $1}' /tmp/head-size.txt)
          DELTA_KB=$((HEAD_KB - BASE_KB))

          {
            echo "## 📦 Bundle Size Diff"
            echo ""
            echo "| Ref | Size |"
            echo "|-----|------|"
            echo "| Base | ${BASE_KB} KB |"
            echo "| Head | ${HEAD_KB} KB |"
            echo "| **Δ** | **${DELTA_KB} KB** |"
            echo ""
            echo "<details><summary>Top 20 chunks (HEAD)</summary>"
            echo ""
            echo '```'
            cat /tmp/head-chunks.txt
            echo '```'
            echo "</details>"
          } > bundle-report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-bundle
          path: bundle-report.md

      - name: Publish to job summary
        if: github.event_name == 'push'
        run: cat bundle-report.md >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 7: TypeScript Error Diff(push 与 PR 都跑)
  # ===========================================================================
  pr-tsc-diff:
    name: TypeScript Error Diff
    if: vars.ENABLE_TSC_DIFF != 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Resolve BASE / HEAD
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            HEAD_SHA="${{ github.event.after }}"
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
              git fetch origin "$DEFAULT_BRANCH" --depth=100 || true
              BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || echo "$HEAD_SHA~1")
            else
              BASE_SHA="$BEFORE"
            fi
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile

      - name: tsc on HEAD
        run: |
          pnpm exec tsc --noEmit --pretty false 2>&1 \
            | grep -vE "src/api/__generated__/|src/solana/" \
            | grep "error TS" | sort -u > /tmp/head-errors.txt || true

      - name: tsc on BASE
        run: |
          git checkout ${{ steps.refs.outputs.base }} -- .
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit --pretty false 2>&1 \
            | grep -vE "src/api/__generated__/|src/solana/" \
            | grep "error TS" | sort -u > /tmp/base-errors.txt || true

      - name: Diff
        run: |
          NEW=$(comm -23 /tmp/head-errors.txt /tmp/base-errors.txt)
          FIXED=$(comm -13 /tmp/head-errors.txt /tmp/base-errors.txt)
          NEW_COUNT=$(echo "$NEW" | grep -c "error TS" || true)
          FIXED_COUNT=$(echo "$FIXED" | grep -c "error TS" || true)

          {
            echo "## 🔍 TypeScript Error Diff"
            echo ""
            echo "- ✅ Fixed: **${FIXED_COUNT}**"
            echo "- ❌ New:   **${NEW_COUNT}**"
            echo ""
            if [ "$NEW_COUNT" -gt 0 ]; then
              echo "<details open><summary>New errors</summary>"
              echo ""
              echo '```'
              echo "$NEW"
              echo '```'
              echo "</details>"
            fi
          } > tsc-report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-tsc
          path: tsc-report.md

      - name: Publish to job summary
        if: github.event_name == 'push'
        run: cat tsc-report.md >> "$GITHUB_STEP_SUMMARY"
